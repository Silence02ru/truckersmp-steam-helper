# Option A: Node.js proxy (server.mjs) behind nginx with HTTPS.
# Replace tmp.example.com with your domain, get a certificate with:
#   certbot --nginx -d tmp.example.com
server {
    listen 80;
    server_name tmp.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

